name: Feature request
description: Suggest a new coaching workflow, reference rule, or script capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What running or coaching task should the skill handle better?
    validations:
      required: true
  - type: textarea
    id: example-prompt
    attributes:
      label: Example prompt
      description: What would a user ask?
      render: text
  - type: textarea
    id: expected-output
    attributes:
      label: Expected output
      description: What should the skill produce?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Readiness / recovery
        - Lap analysis
        - Race planning
        - Fueling
        - Weather / heat stress
        - Injury risk
        - Documentation
        - Other

