# 依赖声明：供支持 dependency manifest 的 harness（如 Codex）自动配置远程 COROS MCP。
# 不读取本文件的 harness 使用本地 coros-mcp CLI 兜底（见 references/coros-tools.md），
# 两条通路等价，优先用 harness 原生 MCP bridge。
interface:
  display_name: "跑步教练"
  short_description: "用跑步手表数据（高驰/佳明）生成可校验的恢复判断与训练处方"
  default_prompt: "使用 $running-coach 分析我的高驰恢复与训练数据，先做安全门控，再给出今天可直接执行的训练处方。"
dependencies:
  tools:
    - type: "mcp"
      value: "coros"
      description: "用于获取高驰健康、恢复、体能和运动活动数据的 COROS MCP server"
      transport: "streamable_http"
      url: "https://mcp.coros.com/mcp"
policy:
  allow_implicit_invocation: true
