interface:
  display_name: "跑步教练"
  short_description: "用高驰数据生成可校验的恢复判断与训练处方"
  default_prompt: "使用 $running-coach 分析我的高驰恢复与训练数据，先做安全门控，再给出今天可直接执行的训练处方。"
dependencies:
  tools:
    - type: "mcp"
      value: "coros"
      description: "用于获取高驰健康、恢复、体能和运动活动数据的 COROS MCP server"
      transport: "streamable_http"
      url: "https://mcp.coros.com/mcp"
policy:
  allow_implicit_invocation: true
